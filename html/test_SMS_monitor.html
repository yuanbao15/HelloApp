<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
    <title>交警短信增强提醒</title>
    <link rel="stylesheet" href="../css/api.css">
    <style>
        /* ========== 基础变量（统一配色） ========== */
        :root {
            --color-primary: #007aff;
            --color-success: #34c759;
            --color-warning: #ff9500;
            --color-danger: #ff3b30;
            --color-text: #1c1c1e;
            --color-text-secondary: #8e8e93;
            --color-text-tertiary: #c7c7cc;
            --color-bg: #f2f2f7;
            --color-card: #ffffff;
            --color-divider: #e5e5ea;
            --color-master-off-bg: linear-gradient(135deg, #fff8f0 0%, #ffeaea 100%);
            --color-master-on-bg: linear-gradient(135deg, #f1f8e9 0%, #e8f5e9 100%);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
            --shadow-md: 0 2px 8px rgba(0,0,0,.08);
            --shadow-lg: 0 4px 16px rgba(0,0,0,.10);
        }

        * { -webkit-tap-highlight-color: transparent; }
        body { background: var(--color-bg); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }

        /* ========== 容器与卡片 ========== */
        .container { padding: 10px 12px 16px; }
        .card {
            background: var(--color-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 10px 14px;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 12px;
            color: var(--color-text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: .3px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 10px;
            background: var(--color-primary);
            border-radius: 2px;
        }
        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-text);
            margin: 4px 4px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-title-icon {
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, var(--color-primary), #5856d6);
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,122,255,.3);
        }
        .app-subtitle {
            font-size: 11px;
            color: var(--color-text-secondary);
            margin: -6px 4px 8px;
        }

        /* ========== 当前状态文字 ========== */
        .status {
            font-size: 12px;
            color: var(--color-text-secondary);
            padding: 4px 8px;
            margin: 2px 0 8px;
            font-weight: 500;
            letter-spacing: .2px;
        }

        /* ========== 状态徽章 ========== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin: 2px 0;
        }
        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s ease-in-out infinite;
        }
        .status-badge.idle { background: #f2f2f7; color: var(--color-text-secondary); }
        .status-badge.listening { background: rgba(52,199,89,.12); color: var(--color-success); }
        .status-badge.alerting { background: rgba(255,59,48,.12); color: var(--color-danger); }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(.8); }
        }
        .error { color: var(--color-danger); font-size: 12px; margin-top: 8px; }
        .error-hidden { display: none; }

        /* ========== 警告提示 ========== */
        .warning {
            background: rgba(255,149,0,.08);
            border: 1px solid rgba(255,149,0,.2);
            border-left: 3px solid var(--color-warning);
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            margin: 4px 0 8px;
            color: #8a6500;
            font-size: 11px;
            line-height: 1.5;
        }
        .warning strong { color: var(--color-warning); }

        /* ========== 开关卡片行（统一格式） ========== */
        .switch-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            gap: 12px;
        }
        .switch-box + .switch-box {
            border-top: 1px solid var(--color-divider);
        }

        /* 总开关强调样式 */
        .master-switch {
            background: var(--color-master-off-bg);
            border: 2px solid var(--color-danger);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(255,59,48,.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .master-switch.on {
            background: var(--color-master-on-bg);
            border-color: var(--color-success);
            box-shadow: 0 2px 8px rgba(52,199,89,.15);
        }
        .master-switch-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .master-switch .master-label {
            font-weight: 700;
            font-size: 15px;
            color: var(--color-danger);
            display: block;
            white-space: nowrap;
        }
        .master-switch.on .master-label { color: #1f7a32; }
        .master-switch .master-hint {
            color: var(--color-text-secondary);
            font-size: 10px;
            margin-top: 2px;
            line-height: 1.3;
        }
        .master-switch.on .master-hint { color: #3da654; }

        /* 监听号码 - 不换行 */
        .target-number-row {
            flex-wrap: nowrap !important;
        }
        .nowrap-label {
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 14px;
            color: var(--color-text);
            font-weight: 500;
        }
        .target-number-input {
            flex: 1;
            min-width: 0;
            text-align: center;
            padding: 6px 10px;
            border: 1px solid var(--color-divider);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #fafafa;
            transition: all .2s;
        }
        .target-number-input:focus {
            background: white;
            border-color: var(--color-primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,122,255,.1);
        }

        /* 自定义 iOS 风格开关 */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
            background-color: #e5e5ea;
            border-radius: 14px;
            transition: background-color .3s cubic-bezier(.4,0,.2,1);
            cursor: pointer;
            border: none;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            flex-shrink: 0;
        }
        .switch:checked { background-color: var(--color-success); }
        .switch::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: transform .3s cubic-bezier(.4,0,.2,1);
            box-shadow: 0 2px 4px rgba(0,0,0,.2), 0 1px 2px rgba(0,0,0,.1);
        }
        .switch:checked::before { transform: translateX(20px); }
        .switch:active::before {
            width: 28px;
        }
        .switch:checked:active::before {
            margin-left: -4px;
        }

        /* ========== 字段标签（统一小标题） ========== */
        .field-label {
            display: block;
            font-size: 11px;
            color: var(--color-text-secondary);
            font-weight: 500;
            margin-bottom: 6px;
        }

        /* ========== 关键词区域 ========== */
        .keyword-list { margin-bottom: 6px; }
        .keyword-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            gap: 8px;
        }
        .keyword-input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--color-divider);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: #fafafa;
            transition: all .2s;
        }
        .keyword-input:focus {
            background: white;
            border-color: var(--color-primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,122,255,.1);
        }

        /* 匹配逻辑 */
        .logic-selector {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--color-divider);
        }
        .logic-selector .field-label { margin-bottom: 6px; }

        /* 自定义 radio - 圆形 */
        input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--color-text-tertiary);
            margin: 0;
            cursor: pointer;
            transition: all .2s;
            position: relative;
            vertical-align: middle;
            flex-shrink: 0;
        }
        input[type="radio"]:checked {
            border-color: var(--color-primary);
            background: var(--color-primary);
            box-shadow: inset 0 0 0 3px white;
        }

        /* radio 选项组（水平排布，节省竖直空间） */
        .radio-group {
            display: flex;
            flex-direction: row;
            gap: 14px;
        }
        /* 兜底：部分老 WebView 不支持 gap，用 margin-left 兼容 */
        .radio-item + .radio-item { margin-left: 14px; }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            background: #fafafa;
            border: 1px solid var(--color-divider);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            color: var(--color-text);
            transition: all .15s;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
        }
        .radio-item:has(input:checked) {
            background: rgba(0,122,255,.06);
            border-color: var(--color-primary);
            color: var(--color-primary);
            font-weight: 500;
        }
        .radio-item:active { background: rgba(0,122,255,.12); }

        /* ========== 音量控制 ========== */
        .volume-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .volume-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 2px 0;
            font-size: 13px;
        }
        /* 兜底：兼容老 WebView（部分 Android WebView 不支持 flex gap） */
        .volume-item > * + * { margin-left: 10px; }
        .volume-item .label {
            white-space: nowrap;
            color: var(--color-text-secondary);
            flex-shrink: 0;
            min-width: 72px;
        }
        .volume-item .value {
            font-weight: 700;
            min-width: 38px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* 自定义滑轨（彻底重做） */
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            min-width: 0;
            height: 32px;
            background: transparent;
            outline: none;
            margin: 0;
            padding: 0;
            cursor: pointer;
        }
        /* WebKit 滑轨（背景轨道） */
        .volume-slider::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right,
                var(--color-primary) 0%,
                var(--color-primary) var(--volume-percent, 30%),
                #e5e5ea var(--volume-percent, 30%),
                #e5e5ea 100%);
        }
        /* WebKit 滑块（圆形 thumb） */
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: white;
            border: 2px solid var(--color-primary);
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 0 0 6px rgba(0,122,255,.08);
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
        }
        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 3px 8px rgba(0,0,0,.25), 0 0 0 8px rgba(0,122,255,.12);
        }
        .volume-slider::-webkit-slider-thumb:active {
            transform: scale(1.25);
            box-shadow: 0 4px 12px rgba(0,0,0,.3), 0 0 0 12px rgba(0,122,255,.15);
        }
        /* Firefox 兼容 */
        .volume-slider::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: #e5e5ea;
        }
        .volume-slider::-moz-range-progress {
            height: 6px;
            border-radius: 3px;
            background: var(--color-primary);
        }
        .volume-slider::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: white;
            border: 2px solid var(--color-primary);
            box-shadow: 0 2px 6px rgba(0,0,0,.18);
            cursor: pointer;
        }

        /* 音量当前值/警报音量值的配色 */
        .current-volume-display { color: var(--color-primary); font-weight: 700; }
        .volume-value { color: var(--color-primary); }

        /* 防止音量显示抖动 */
        .volume-item { min-height: 36px; }

        /* ========== 音效选择 ========== */
        .sound-selector-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 6px 0;
            font-size: 14px;
            color: var(--color-text);
            flex-wrap: wrap;
        }
        .sound-selector-row label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        /* ========== 通用按钮变体 ========== */
        .btn {
            padding: 10px 16px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all .2s;
            -webkit-appearance: none;
            appearance: none;
        }
        .btn:active { transform: scale(0.97); opacity: 0.85; }
        .btn:disabled { background: var(--color-text-tertiary); cursor: not-allowed; opacity: 0.5; }
        .btn-small { padding: 6px 12px; font-size: 13px; }
        .btn-outline {
            background: white;
            color: var(--color-primary);
            border: 1px solid var(--color-primary);
        }
        .btn-outline:active { background: rgba(0,122,255,.08); }
        .btn-danger { background: var(--color-danger); }
        .btn-danger:active { background: #d70015; }
        .btn-success { background: var(--color-success); }
        .btn-success:active { background: #248a3d; }
        .btn-ghost {
            background: var(--color-bg);
            color: var(--color-text);
        }

        /* 按钮组（主页底部 3 个功能按钮） */
        .button-group {
            display: flex;
            gap: 14px;
            margin-top: 2px;
        }
        /* 兜底：兼容老 WebView（部分 Android WebView 不支持 flex gap） */
        .button-group .btn + .btn { margin-left: 14px; }
        .button-group .btn {
            flex: 1;
            min-width: 0;
            padding: 9px 6px;
            font-size: 13px;
            border-radius: var(--radius-sm);
        }
        /* 操作按钮卡片：让按钮呼吸感更强 */
        .button-card .btn-outline { padding: 9px 6px; }

        /* 删除按钮（小圆） */
        .btn-delete {
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1;
            color: white;
            background: var(--color-danger);
            border-radius: 50%;
            flex-shrink: 0;
        }
        .btn-delete:active { background: #d70015; transform: scale(0.92); }

        /* 添加关键词按钮（次要按钮） */
        .add-keyword-btn {
            width: 100%;
            margin-top: 8px;
            padding: 7px;
            background: var(--color-bg);
            color: var(--color-primary);
            border: 1px dashed var(--color-primary);
            font-size: 13px;
            border-radius: var(--radius-sm);
        }

        /* ========== 音效选择 ========== */
        .sound-control {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--color-divider);
        }
        .sound-control .field-label { margin-bottom: 6px; }
        .btn-test-sound {
            width: 100%;
            margin-top: 8px;
            padding: 8px;
            font-size: 13px;
        }

        /* ========== 日志区 ========== */
        .log-area {
            max-height: 280px;
            overflow-y: auto;
            border-radius: var(--radius-md);
            padding: 2px;
            background: transparent;
            /* 隐藏滚动条但保留功能（更简洁） */
            scrollbar-width: thin;
            scrollbar-color: var(--color-text-tertiary) transparent;
        }
        .log-area::-webkit-scrollbar { width: 4px; }
        .log-area::-webkit-scrollbar-thumb { background: var(--color-text-tertiary); border-radius: 2px; }
        .log-item {
            margin: 3px 0;
            padding: 6px 8px 6px 10px;
            background: white;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--color-text-tertiary);
            font-size: 11px;
            line-height: 1.45;
            box-shadow: var(--shadow-sm);
            animation: logFadeIn .25s ease;
        }
        @keyframes logFadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .log-item.success { border-left-color: var(--color-success); }
        .log-item.error   { border-left-color: var(--color-danger); }
        .log-item.warning { border-left-color: var(--color-warning); }
        .log-item.info    { border-left-color: var(--color-primary); }
        .log-time {
            color: var(--color-text-tertiary);
            font-size: 9px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 1px;
        }
        .log-content { color: var(--color-text); }

        /* ========== 兼容老结构（settings 包住多组开关时仍能用） ========== */
        .settings {
            background: var(--color-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 4px 16px;
            margin-bottom: 12px;
        }

        /* 号码匹配样式（启用/禁用颜色变化） */
        .number-disabled { color: var(--color-text-secondary); font-weight: normal; }
        .number-enabled { color: var(--color-text); font-weight: 600; }
        .section-disabled { opacity: 0.45; pointer-events: none; }
        .number-input-disabled { color: var(--color-text-tertiary); }
        .number-input-enabled { color: var(--color-text); }

    </style>
</head>
<body>
<div class="container">
    <h1>交警短信增强提醒</h1>
    
    <div class="warning">
        <strong>注意：</strong>需给本应用开启最高权限，如读取短信、关闭电源优化策略等以保障后台稳定运行。本应用不会联网，数据存储分析均在本地，可放心使用。<br>
    </div>
    
    <div class="settings">
        <div class="switch-box master-switch" id="masterSwitchBox">
            <div class="master-switch-text">
                <span class="master-label">短信监听提醒总开关</span>
                <small class="master-hint">关闭后所有监听规则都不生效</small>
            </div>
            <input type="checkbox" id="smsSwitch" class="switch">
        </div>

        <div class="switch-box target-number-row">
            <span class="nowrap-label">监听号码</span>
            <input type="text" id="targetNumber" placeholder="例如: 12123" value="12123" class="target-number-input" maxlength="20">
            <input type="checkbox" id="enableNumberMatch" class="switch" style="margin-left: 10px;">
        </div>

        
        <div class="card">
            <div class="card-title">关键词规则</div>
            <div id="keywordSection">
                <div class="field-label">短信内容关键词</div>
                <div id="keywordList">
                    <div class="keyword-item">
                        <input type="text" class="keyword-input" value="湖北交警" placeholder="输入关键词">
                        <button class="btn btn-small btn-danger btn-delete" onclick="removeKeyword(this, 0)">−</button>
                    </div>
                    <div class="keyword-item">
                        <input type="text" class="keyword-input" value="鄂AY366Q" placeholder="输入关键词">
                        <button class="btn btn-small btn-danger btn-delete" onclick="removeKeyword(this, 1)">−</button>
                    </div>
                </div>
                <button class="btn btn-small add-keyword-btn" onclick="addKeyword()">+ 添加关键词</button>
            </div>
            <div id="logicSection" class="logic-selector">
                <span class="field-label">匹配逻辑</span>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" id="logicOr" name="logic" value="or" checked><span>逻辑或</span></label>
                    <label class="radio-item"><input type="radio" id="logicAnd" name="logic" value="and"><span>逻辑与</span></label>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">警报音效</div>
            <div class="volume-control">
                <div class="volume-item">
                    <span class="label">当前系统音量</span>
                    <span id="currentVolume" class="current-volume-display value">获取中...</span>
                    <button class="btn btn-small btn-outline" onclick="refreshCurrentVolume()">刷新</button>
                </div>
                <div class="volume-item">
                    <span class="label">警报音量</span>
                    <input type="range" id="alertVolume" class="volume-slider" min="0" max="100" value="50">
                    <span id="alertVolumeValue" class="volume-value value">30%</span>
                </div>
            </div>
            <div class="sound-control">
                <div class="field-label">音效选择</div>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" id="soundShort" name="sound" value="short_ring.mp3" checked><span>简短铃声</span></label>

<script src="../script/api.js"></script>
<script>
    var smsListenerModule = null; // 短信监听模块
    var acc5Util = null; // 引入acc5Util模块-控制音量
    var moduleProcessAlive = null; // YB-自己的进程守护模块，用于保活
    var moduleNotification = null; // YB-自己的通知模块
    var isListening = false; // 是否开启监听
    var targetNumber = '12123'; // 监听短信的目标号码
    var keywords = ['湖北交警', '鄂AY366Q']; // 初始化默认关键词
    var matchLogic = 'or'; // 逻辑：'or' 或 'and'
    var isPlaying = false; // 是否正在播放警报铃声
    var selectedSound = 'short_ring.mp3'; // 当前选择的音效文件
    var isTestPlaying = false; // 是否正在试听音效
    var enableNumberMatch = false; // 是否启用号码匹配
    var isDialogShowing = false; // 是否正在显示对话框
    
    // 统计相关变量
    var alertRecords = []; // 警报记录数组
    var currentYear = new Date().getFullYear(); // 当前年份

    // ========== 唯一实例ID和互斥锁 ===========
    window.__SMS_MONITOR_INSTANCE_ID = window.__SMS_MONITOR_INSTANCE_ID || Date.now() + '-' + Math.floor(10000 + Math.random() * 90000);
    window.__SMS_MONITOR_LOCK = window.__SMS_MONITOR_LOCK || false;

    apiready = function() {
        // 互斥锁判断，若已有实例则直接return
        if (window.__SMS_MONITOR_LOCK) {
            console.log('【SMS监听】已有实例在运行，本实例不再注册监听:', window.__SMS_MONITOR_INSTANCE_ID);
            return;
        }
        window.__SMS_MONITOR_LOCK = true;
        console.log('【SMS监听】实例启动:', window.__SMS_MONITOR_INSTANCE_ID);
        
        // 检查权限
        checkSMSPermission();
        
        // 尝试初始化短信监听模块
        initSMSListenerModule();

        // 初始化UI
        initUI();

        // 初始化acc5Util模块
        initAcc5Util();
        
        // 加载警报记录
        loadAlertRecords();
        
        // 页面卸载时确保停止播放
        api.addEventListener({
            name: 'pause'
        }, function(ret, err) {
            if (isPlaying) {
                api.stopPlay();
                isPlaying = false;
                updateStatusDisplay();
                addLog('页面暂停，停止警报铃声', 'warning');

                // 恢复原始音量
                restoreOriginalVolume();
            }

            // 重置试听状态
            if (isTestPlaying) {
                api.stopPlay();
                isTestPlaying = false;
                document.getElementById('testSoundBtn').textContent = '🔊 试听音效';
                addLog('页面暂停，停止音效试听', 'warning');

                // 恢复原始音量
                restoreOriginalVolume();
            }

            // 注意（B6 修复）：pause 事件在 APICloud 中会在 frame 切换时触发，
            // 此时主框架仍持有 __SMS_MONITOR_LOCK 引用，若在此处释放会导致
            // frame 重新显示时不再注册监听 → 短信接收不到。
            // 仅在 win 完全销毁（app 退出）时由 OS 回收锁，此处不再主动释放。
        });

        // 监听 APP 从后台切回前台（如解锁屏幕）
        // 解决 MIUI 深度休眠后 BroadcastReceiver 失效、锁屏期间收到的短信
        // 在解锁后才能被监听到的问题
        api.addEventListener({
            name: 'resume'
        }, function(ret, err) {
            addLog('APP 从后台恢复（resume），检查短信监听状态', 'info');
            // 如果用户已开启监听，则重新注册以接管系统缓存的短信广播
            if (isListening && smsListenerModule) {
                doRegisterSMSListener('resume');
            }
        });

        // appactive 是 APICloud 的另一组前台事件，与 resume 互补，
        // 部分 MIUI 设备在某些情况下只触发 appactive 不触发 resume
        api.addEventListener({
            name: 'appactive'
        }, function(ret, err) {
            addLog('APP 进入活跃状态（appactive），检查短信监听状态', 'info');
            if (isListening && smsListenerModule) {
                doRegisterSMSListener('appactive');
            }
        });
    };

    // 初始化UI
    function initUI() {
        // 获取开关元素
        var smsSwitch = document.getElementById('smsSwitch');
        var statusText = document.getElementById('statusText');
        
        // 从本地存储加载设置
        var savedListening = api.getPrefs({sync: true, key: 'isListening'});
        if(savedListening === 'true') {
            smsSwitch.checked = true;
            statusText.textContent = '当前状态: 监听中';
            // 启用相关区域
            enableSections();
            // 总开关初始化为"开启"绿色高亮
            var masterBox = document.getElementById('masterSwitchBox');
            if (masterBox) masterBox.classList.add('on');
            // 延迟启动监听，确保模块已初始化
            setTimeout(function() {
                startSMSListener();
            }, 500);
        } else {
            // 禁用相关区域
            disableSections();
        }
        
        // 监听开关变化
        smsSwitch.addEventListener('change', function(e) {
            // 同步震动反馈：在用户手势同步上下文中调用 vibrate 是允许的
            // （异步 setTimeout 中调用会被 Chrome 拦截，但 change 事件是同步的）
            try {
                if (navigator.vibrate &&
                    (!navigator.userActivation || navigator.userActivation.isActive)) {
                    navigator.vibrate(e.target.checked ? [20, 30, 30] : 15);
                }
            } catch (_) { /* 静默 */ }

            var masterBox = document.getElementById('masterSwitchBox');
            if(e.target.checked) {
                statusText.textContent = '当前状态: 正在启动监听...';
                startSMSListener();
                // 启用相关区域
                enableSections();
                // 总开关强调样式：开启后变为绿色高亮
                if (masterBox) masterBox.classList.add('on');
                // Toast 反馈（global: true 跨 frame 显示）
                api.toast({
                    msg: '✅ 已开启短信监听',
                    duration: 2000,
                    location: 'middle'
                });
            } else {
                statusText.textContent = '当前状态: 已停止监听';
                stopSMSListener();
                // 禁用相关区域
                disableSections();
                // 总开关强调样式：关闭后回到红色警示
                if (masterBox) masterBox.classList.remove('on');
                // Toast 反馈
                api.toast({
                    msg: '⛔ 已停止短信监听',
                    duration: 2000,
                    location: 'middle'
                });
            }
            // 保存设置
            api.setPrefs({
                key: 'isListening',
                value: e.target.checked.toString()
            });
        });
        
        // 加载目标号码
        var savedTargetNumber = api.getPrefs({sync: true, key: 'targetNumber'});
        if(savedTargetNumber) {
            document.getElementById('targetNumber').value = savedTargetNumber;
            targetNumber = savedTargetNumber;
        }
        
        // 加载号码匹配设置
        var savedNumberMatch = api.getPrefs({sync: true, key: 'enableNumberMatch'});
        if(savedNumberMatch === 'true') {
            enableNumberMatch = true;
            document.getElementById('enableNumberMatch').checked = true;
            updateNumberDisplay(true);
        } else {
            updateNumberDisplay(false);
        }
        
        // 监听号码输入变化
        document.getElementById('targetNumber').addEventListener('input', function(e) {
            targetNumber = e.target.value;
            api.setPrefs({
                key: 'targetNumber',
                value: targetNumber
            });
        });
        
        // 监听号码匹配checkbox变化
        document.getElementById('enableNumberMatch').addEventListener('change', function(e) {
            enableNumberMatch = e.target.checked;
            updateNumberDisplay(enableNumberMatch);
            
            // 保存设置
            api.setPrefs({
                key: 'enableNumberMatch',
                value: enableNumberMatch.toString()
            });
            
            addLog('号码匹配已' + (enableNumberMatch ? '启用' : '禁用'), 'success');
        });
        
        // 加载关键词
        var savedKeywords = api.getPrefs({sync: true, key: 'keywords'});
        if(savedKeywords) {
            keywords = JSON.parse(savedKeywords);
            updateKeywordUI();
        }
        
        // 加载匹配逻辑
        var savedLogic = api.getPrefs({sync: true, key: 'matchLogic'});
        if(savedLogic) {
            matchLogic = savedLogic;
            document.getElementById('logic' + matchLogic.charAt(0).toUpperCase() + matchLogic.slice(1)).checked = true;
        }
        
        // 监听逻辑选择变化
        document.querySelectorAll('input[name="logic"]').forEach(function(radio) {
            radio.addEventListener('change', function(e) {
                matchLogic = e.target.value;
                api.setPrefs({
                    key: 'matchLogic',
                    value: matchLogic
                });
                addLog('匹配逻辑已更改为: ' + (matchLogic === 'or' ? '逻辑或' : '逻辑与'), 'success');
            });
        });

        // 初始化音量控制
        initVolumeControl();
        
        // 初始化音效控制
        initSoundControl();
    }

    // 更新关键词UI
    function updateKeywordUI() {
        var keywordList = document.getElementById('keywordList');
        keywordList.innerHTML = '';
        
        keywords.forEach(function(keyword, index) {
            var item = document.createElement('div');
            item.className = 'keyword-item';
            item.innerHTML = `
                <input type="text" class="keyword-input" value="${keyword}" placeholder="输入关键词" onchange="updateKeyword(${index}, this.value)">
                <button class="btn btn-small btn-danger btn-delete" onclick="removeKeyword(this, ${index})">−</button>
            `;
            keywordList.appendChild(item);
        });
    }

    // 添加关键词的操作
    function addKeyword() {
        keywords.push('');
        updateKeywordUI();
        saveKeywords();
        addLog('已添加新关键词', 'success');
    }

    // 删除关键词的操作
    function removeKeyword(button, index) {
        if (keywords.length <= 1) {
            api.toast({
                msg: '至少需要保留一个关键词',
                duration: 3000,
                location: 'top'
            });
            addLog('至少需要保留一个关键词', 'error');
            return;
        }
        keywords.splice(index, 1);
        updateKeywordUI();
        saveKeywords();
        addLog('已删除关键词', 'success');

    // 更新关键词的操作
    function updateKeyword(index, value) {
        keywords[index] = value;
        saveKeywords();
        addLog('关键词已更新: ' + value, 'success');

    function saveKeywords() {
        api.setPrefs({
            key: 'keywords',
            value: JSON.stringify(keywords)
        });
    }

    // 初始化短信监听模块
    function initSMSListenerModule() {
        try {
            // 使用正确的smsListener模块，用于监听短信
            smsListenerModule = api.require('smsListener');
            moduleProcessAlive = api.require('moduleProcessAlive_2024'); // YB-自己的进程守护模块，用于保活
            moduleNotification = api.require('moduleNotification_2022'); // YB-自己的通知模块
            addLog('短信监听模块初始化成功，另有进程守护模块和通知模块', 'success');
        } catch (e) {
            addLog('短信监听模块初始化失败: ' + e.message, 'error');
            showError('短信监听模块不可用，请检查APICloud配置');
        }
    }

    // 初始化acc5Util模块-用于控制音量
    function initAcc5Util() {
        try {
            // 使用正确的acc5Util模块，用于控制音量
            acc5Util = api.require('acc5Util');
            addLog('acc5Util模块初始化成功', 'success');
            
            // 模块初始化成功后立即获取系统音量
            setTimeout(function() {
                refreshCurrentVolume();
            }, 200); // 延迟200ms确保模块完全初始化
            
        } catch (e) {
            addLog('acc5Util模块初始化失败: ' + e.message, 'error');
            showError('acc5Util模块不可用，请检查APICloud配置');

    // 检查短信读取权限
    function checkSMSPermission() {
        var permissions = ['sms']; // 短信读取权限，查询官网确定

        try {
            api.requestPermission({
                list: permissions,
                code: 100001
            }, function(ret, err) {

                if (err) {
                    addLog('权限请求出错: ' + JSON.stringify(err), 'error');
                    showError('权限请求出错: ' + err.msg);
                    api.toast({
                        msg: '❌ 权限请求出错',
                        duration: 2000,
                        location: 'middle'
                    });
                    return;
                }
                
                if (ret) {
                    if (ret.list && ret.list.length > 0) {
                        var granted = ret.list.filter(function(item) {
                            return item.granted;
                        });
                        
                        if (granted.length > 0) {
                            addLog('短信读取权限已授权', 'success');
                            api.toast({
                                msg: '✅ 短信读取权限已授权',
                                duration: 2000,
                                location: 'middle'
                            });
                        } else {
                            addLog('短信读取权限被拒绝', 'error');
                            showError('需要短信读取权限才能使用此功能');
                            
                            // 提示用户手动开启权限
                            api.confirm({
                                title: '权限被拒绝',
                                msg: '短信读取权限被拒绝，请在系统设置中手动开启权限。是否前往设置？',
                                buttons: ['取消', '去设置']
                            }, function(ret) {
                                if (ret.buttonIndex === 2) {
                                    // 打开应用设置页面
                                    api.openApp({
                                        androidPkg: 'com.android.settings',
                                        mimeType: 'text/html',
                                        uri: 'package:' + api.appId
                                    });
                                }
                            });
                        }
                    } else {
                        addLog('权限列表为空', 'error');
                        showError('权限列表为空，请检查权限配置');
                    }
                } else {
                    addLog('权限请求无返回结果', 'error');
                    showError('权限请求无返回结果');
                }
            });
        } catch (e) {
            addLog('权限请求异常: ' + e.message, 'error');
            showError('权限请求异常: ' + e.message);
        }
    }


    // 启动短信监听功能
    function startSMSListener() {
        if (!smsListenerModule) {
            addLog('短信监听模块未初始化，无法启动监听', 'error');
            showError('短信监听模块未初始化');
            return;
        }

        if (isListening) {
            addLog('监听已启动，跳过重复注册', 'info');
            return;
        }

        // 复用内部注册方法：先注销旧的，再注册新的
        if (doRegisterSMSListener('启动')) {
            isListening = true;
            startAlive(); // 同时开启线程常驻
        }
    }

    // 内部方法：执行实际的注册（先注销旧的，再注册新的）
    // 用于在"启动监听"和"resume / appactive 事件"中复用。
    // 当 MIUI 深度休眠冻结进程后再次唤醒时，原 BroadcastReceiver 可能已失效，
    // 必须重新注册才能接收休眠期间系统缓存的短信广播。
    var _lastRegisterTime = 0;  // 节流：避免短时间内反复注册
    function doRegisterSMSListener(reason) {
        if (!smsListenerModule) {
            return false;
        }

        // 节流：距上次注册不足 1 秒则跳过（避免频繁切换 APP 时反复注销/注册）
        var now = Date.now();
        if (reason === 'resume' && (now - _lastRegisterTime) < 1000) {
            console.log('【SMS监听】resume 距上次注册 < 1s，跳过本次注册');
            return false;
        }
        _lastRegisterTime = now;

        try {
            // 先注销旧的（如果存在），确保不会重复注册
            smsListenerModule.unRegisterSmsListener();

            // 注册新的短信监听
            smsListenerModule.registerSmsListener(function(ret) {
                processSMS(ret);
            });

            addLog('短信监听已注册（' + (reason || '手动') + '）', 'success');
            return true;
        } catch (e) {
            addLog('注册短信监听失败: ' + e.message, 'error');
            return false;
        }
    }

    // 停止短信监听功能
    function stopSMSListener() {
        try {
            if (smsListenerModule) {
                // 使用正确的API注销短信监听
                smsListenerModule.unRegisterSmsListener();
            }

            // 同时停止进程保活（B4 修复）
            stopAlive();

            isListening = false;
            addLog('短信监听已停止', 'success');

        } catch (e) {
            addLog('停止短信监听失败: ' + e.message, 'error');
        }
    }

    // 存储最近处理的短信（用于去重）
    // 从localStorage加载最近处理记录（跨会话/实例共享）
    var storedRecentSMS = localStorage.getItem('recentSMS');
    var recentSMS = storedRecentSMS ? JSON.parse(storedRecentSMS) : { timestamp: 0, tel: '', content: '' };
    var SMS_DUPLICATE_WINDOW = 5000; // 去重时间窗口（毫秒）

    // 对监听到的短信进行处理，满足条件后触发提醒
    // 注意：去重 + 并发检测逻辑使用 while 循环 + 最大重试次数，
    // 避免并发更新时无限递归导致栈溢出（B3 修复）
    var MAX_DEDUPE_RETRY = 3;

    function processSMS(sms) {
        if (!sms || !sms.tel) {
            return;
        }

        // 测试短信（如手动测试触发）：直接走警报流程，绕过去重
        // 真实短信（来自 smsListener）isTest 为 undefined，正常进入去重逻辑
        var isTestSms = sms.isTest === true;
        if (isTestSms) {
            addLog('【测试短信】跳过去重检测', 'info');
            doTriggerAlert(sms);
            return;
        }

        var retry = 0;
        var storedRecentSMS, storedAlertRecords;
        var isDuplicate, now;

        // 去重 + 并发重试循环（最多 MAX_DEDUPE_RETRY 次）
        while (true) {
            // 读取最新的去重记录（解决多实例同步问题）
            storedRecentSMS = localStorage.getItem('recentSMS');
            storedAlertRecords = api.getPrefs({sync: true, key: 'alertRecords_' + currentYear});
            var currentRecentSMS = storedRecentSMS ? JSON.parse(storedRecentSMS) : { timestamp: 0, tel: '', content: '' };

            // 刷新警报记录确保使用最新数据
            loadAlertRecords();

            // 检查是否为重复短信
            // 按天去重逻辑：同一天内相同手机号和内容视为重复
            var currentDate = new Date().toISOString().split('T')[0];
            var recentDate = new Date(currentRecentSMS.timestamp).toISOString().split('T')[0];
            isDuplicate = (currentDate === recentDate &&
                          currentRecentSMS.tel === sms.tel &&
                          currentRecentSMS.content === sms.content);

            // 同时检查历史警报记录防止多实例重复
            if (!isDuplicate) {
                var latestAlertRecords = storedAlertRecords ? JSON.parse(storedAlertRecords) : [];
                var recentAlert = latestAlertRecords.find(function(record) {
                    var recordDate = new Date(new Date(record.timestamp).getTime()).toISOString().split('T')[0];
                    return (currentDate === recordDate &&
                        record.phoneNumber === sms.tel &&
                        record.content === sms.content);
                });
                isDuplicate = !!recentAlert;
            }

            if (isDuplicate) {
                addLog('检测到重复短信，已忽略处理', 'warning');
                return;
            }

            // 并发更新检测：验证期间是否有其他实例修改了数据
            var latestStoredRecentSMS = localStorage.getItem('recentSMS');
            var latestStoredAlertRecords = api.getPrefs({sync: true, key: 'alertRecords_' + currentYear});
            if (latestStoredRecentSMS === storedRecentSMS && latestStoredAlertRecords === storedAlertRecords) {
                // 无并发更新，退出重试循环
                break;
            }

            // 有并发更新，重试（限制最大次数）
            retry++;
            if (retry > MAX_DEDUPE_RETRY) {
                addLog('并发检测超过最大重试次数（' + MAX_DEDUPE_RETRY + '），放弃本次处理', 'error');
                return;
            }
            addLog('检测到并发更新，重新检查重复（' + retry + '/' + MAX_DEDUPE_RETRY + '）', 'info');
        }

        // 通过去重 + 并发检测，记录当前短信到 localStorage
        now = Date.now();
        var newRecentSMS = { timestamp: now, tel: sms.tel, content: sms.content };
        localStorage.setItem('recentSMS', JSON.stringify(newRecentSMS));
        recentSMS = newRecentSMS;

        // 共用触发流程
        doTriggerAlert(sms);
    }

    // 触发警报（号码匹配 + 关键词匹配 + 通知/记录/播放）
    // 真实短信与测试短信共用，确保行为一致
    function doTriggerAlert(sms) {
        addLog('收到短信来自: ' + sms.tel + ', 内容: ' + (sms.content ? sms.content.substr(0, 30) + '...' : '无内容'));

        // 如果启用了号码匹配，先检查号码
        if (enableNumberMatch) {
            if (sms.tel.indexOf(targetNumber) === -1) {
                addLog('号码不匹配，忽略短信', 'success');
                return;
            }
            addLog('号码匹配成功: ' + sms.tel, 'success');
        } else {
            addLog('号码匹配已禁用，跳过号码检查', 'success');
        }

        // 检查短信内容是否匹配关键词
        if (checkContentMatch(sms.content)) {
            addLog('短信内容匹配关键词，触发提醒', 'success');
            // 推送通知到通知栏
            showNotification('【紧急】交警短信', sms.content);

            // 记录警报事件
            recordAlert(sms);

            // 重点：播放提醒音效并在APP内弹窗
            playAlert(sms.content);
        } else {
            addLog('短信内容不匹配关键词，忽略', 'success');
        }
    }
    // 判断关键词是否匹配
    function checkContentMatch(content) {
        if (!content || keywords.length === 0) {
            return false;
        }
        
        var matchedKeywords = keywords.filter(function(keyword) {
            return keyword && content.indexOf(keyword) !== -1;
        });
        
        if (matchLogic === 'or') {
            // 逻辑或：任一关键词匹配即可
            return matchedKeywords.length > 0;
        } else {
            // 逻辑与：所有关键词都必须匹配
            return matchedKeywords.length === keywords.filter(function(k) { return k; }).length;
        }
    }

    function playAlert(smsContent) {
        try {
            // 如果正在播放，先停止
            if (isPlaying) {
                api.stopPlay();
                isPlaying = false;
                addLog('停止之前的警报铃声', 'success');
            }
            
            // 播放提醒音效
            // 警车长音效：policeCar_alert.mp3
            // 简短三秒音效：short_ring.mp3
            var audioPath = 'widget://res/' + selectedSound; // 需要准备一个提醒音效
            
            isPlaying = true;
            addLog('开始连续播放警报铃声，点击"我知道了"停止', 'success');
            updateStatusDisplay();

            // 获取设置的警报音量
            var alertVolumePercent = document.getElementById('alertVolume').value;
            var alertVolume = alertVolumePercent / 100;
            
            // 保存当前音量并设置警报音量，通过回调接口实现音量设置后触发播放，避免异步问题
            saveAndSetVolume(alertVolume, function(success) {
                if (success) {
                    // 开始连续播放铃声
                    startContinuousPlay(audioPath, smsContent);
                } else {
                    isPlaying = false;
                    addLog('音量设置失败，无法播放警报铃声', 'error');
                    updateStatusDisplay();
                    restoreOriginalVolume();
                }
            });

            // 显示提醒对话框（如果还没有显示）
            if (!isDialogShowing) {
                showAlertDialog(smsContent);
            }
            
        } catch (e) {
            isPlaying = false;
            addLog('警报铃声播放异常: ' + e.message, 'error');
            updateStatusDisplay();
            // 异常情况下也要恢复原始音量
            restoreOriginalVolume();
        }
    }

    // 连续播放函数
    function startContinuousPlay(audioPath, smsContent) {
        if (!isPlaying) {
            return; // 如果已经停止播放，退出循环
        }
        
        api.startPlay({
            path: audioPath,
        }, function(ret, err) {
            if (ret) {
                // 播放完成，如果还在播放状态，继续播放下一遍
                if (isPlaying) {
                    addLog('警报铃声播放完成，继续下一遍...', 'success');
                    // 短暂延迟后继续播放
                    setTimeout(function() {
                        if (isPlaying) {
                            startContinuousPlay(audioPath, smsContent);
                        }
                    }, 500); // 500ms延迟确保音频设备完成播放周期
                } else {
                    addLog('警报铃声已停止', 'success');
                    updateStatusDisplay();
                    // 恢复原始音量
                    restoreOriginalVolume();
                }
            } else {
                isPlaying = false;
                addLog('警报铃声播放失败: ' + JSON.stringify(err), 'error');
                updateStatusDisplay();
                // 播放失败也要恢复原始音量
                restoreOriginalVolume();
                
            }
        });
    }

    // 添加日志：成功、失败、警告
    function addLog(text, type) {
        var logArea = document.getElementById('logArea');
        var time = new Date().toLocaleTimeString();
        var logItem = document.createElement('div');
        // 用 type 作为 class（CSS .log-item.success/.error/.warning/.info 左侧色条）
        logItem.className = 'log-item ' + (type || 'info');

        var timeSpan = document.createElement('div');
        timeSpan.className = 'log-time';
        timeSpan.textContent = time;

        var contentSpan = document.createElement('div');
        contentSpan.className = 'log-content';
        contentSpan.textContent = text;

        logItem.appendChild(timeSpan);
        logItem.appendChild(contentSpan);

        // 在顶部插入新的日志
        if (logArea.firstChild) {
            logArea.insertBefore(logItem, logArea.firstChild);
        } else {
            logArea.appendChild(logItem);
        }

        // 限制日志数量，最多显示50条
        while (logArea.children.length > 50) {
            logArea.removeChild(logArea.lastChild);
        }
        
        console.log(time + ': ' + text);
    }

    // 初始化音量控制
    function initVolumeControl() {
        var slider = document.getElementById('alertVolume');
        var valueLabel = document.getElementById('alertVolumeValue');

        // 工具：更新滑轨的 CSS 变量（让 track 进度颜色跟随值变化）
        function updateSliderFill(percent) {
            slider.style.setProperty('--volume-percent', percent + '%');
        }

        // 加载保存的警报音量设置
        var savedAlertVolume = api.getPrefs({sync: true, key: 'alertVolume'});
        if(savedAlertVolume) {
            var volumePercent = parseFloat(savedAlertVolume) * 100;
            slider.value = volumePercent;
            valueLabel.textContent = volumePercent.toFixed(0) + '%';
        }
        // 初始化滑轨颜色
        updateSliderFill(slider.value);

        // 节流函数，减少频繁更新
        var updateTimeout = null;
        var lastUpdateTime = 0;

        // 监听音量滑块变化 - 使用节流减少更新频率
        slider.addEventListener('input', function(e) {
            var volumePercent = e.target.value;
            var currentTime = Date.now();

            // 实时更新滑轨颜色 + 显示值（节流 50ms）
            if (currentTime - lastUpdateTime > 50) {
                updateSliderFill(volumePercent);
                valueLabel.textContent = volumePercent + '%';
                lastUpdateTime = currentTime;
            }

            // 清除之前的定时器
            if (updateTimeout) {
                clearTimeout(updateTimeout);
            }

            // 延迟保存设置，避免频繁写入
            updateTimeout = setTimeout(function() {
                api.setPrefs({
                    key: 'alertVolume',
                    value: (volumePercent / 100).toString()
                });
            }, 200);
        });

        // 监听音量滑块拖动结束 - 只在拖动结束后打印日志
        slider.addEventListener('change', function(e) {
            var volumePercent = e.target.value;
            updateSliderFill(volumePercent);
            valueLabel.textContent = volumePercent + '%';
            addLog('警报音量已设置为: ' + volumePercent + '%', 'success');
        });
    }

        acc5Util.getVol({}, function(ret, err) {

                setTimeout(function() {

    // 记录原始音量
    var originalVolume = 0; // 值为0到1之间的小数，0为静音，1为最大音量。
    
    // 保存当前音量并设置新音量
    function saveAndSetVolume(newVolume, callback) {
    if (!acc5Util) {
        addLog('acc5Util模块未初始化，无法控制音量', 'error');
        if (callback) callback(false);
        return false;
    }
    
    // 先获取当前音量：system：系统音量，music：媒体音量，ring：铃声音量，call：通话音量，alarm：闹钟音量，notice: 通知音量
    acc5Util.getVol({}, function(ret, err) {
        if (ret && ret.data) {
            originalVolume = ret.data.music;
            console.log('----------------当前系统音量2：' + JSON.stringify(ret));
            addLog('保存原始音量: ' + (originalVolume * 100).toFixed(0) + '%', 'success');
            
            // 设置新音量
            acc5Util.setVol({value: newVolume}, function(setRet, setErr) {
                if (setRet) {
                    addLog('设置警报音量: ' + (newVolume * 100).toFixed(0) + '%', 'success');
                    if (callback) callback(true);
                } else {
                    addLog('设置音量失败: ' + JSON.stringify(setErr), 'error');
                    if (callback) callback(false);
                }
            });
        } else {
            addLog('获取原始音量失败: ' + JSON.stringify(err), 'error');
            if (callback) callback(false);
        }
    });
    
    return true;
}
    
    // 恢复原始音量

            }
        });
    }

                        msg: '❌ 音效试听失败',
                        duration: 2000,
                        location: 'middle'
                    });
                }

                // 试听完成后恢复按钮状态
                isTestPlaying = false;
                testBtn.textContent = TEST_BTN_DEFAULT_TEXT;

                // 试听完成后恢复原始音量
                restoreOriginalVolume();
            });
        } catch (e) {
            addLog('音效试听异常: ' + e.message, 'error');
            isTestPlaying = false;
            testBtn.textContent = TEST_BTN_DEFAULT_TEXT;

            // 异常情况下也要恢复原始音量
            restoreOriginalVolume();
        }
    }

    // 更新号码显示样式
    function updateNumberDisplay(enabled) {
        var numberLabel = document.querySelector('.switch-box:nth-child(2) span');
        var numberInput = document.getElementById('targetNumber');
        if (enabled) {
            numberLabel.classList.add('number-enabled');
            numberLabel.classList.remove('number-disabled');
            numberInput.classList.remove('number-input-disabled');
            numberInput.classList.add('number-input-enabled');
        } else {
            numberLabel.classList.add('number-disabled');
            numberLabel.classList.remove('number-enabled');
            numberInput.classList.add('number-input-disabled');
            numberInput.classList.remove('number-input-enabled');
        }
    }

    
    // 启用相关区域
    function enableSections() {
        document.getElementById('keywordSection').classList.remove('section-disabled');
        document.getElementById('logicSection').classList.remove('section-disabled');
        addLog('已启用关键词和逻辑匹配区域', 'success');
    }
    
    // 禁用相关区域
    function disableSections() {
        document.getElementById('keywordSection').classList.add('section-disabled');
        document.getElementById('logicSection').classList.add('section-disabled');
        addLog('已禁用关键词和逻辑匹配区域', 'success');
    }
    
    // ==================== 统计功能相关函数 ====================
    
    // 记录警报事件
    function recordAlert(sms) {
        // 第一次检查：加载最新记录
        loadAlertRecords();
        var currentDate = new Date().toISOString().split('T')[0];
        var exists = alertRecords.some(function(r) {
            return r.phoneNumber === sms.tel && r.content === sms.content && r.date === currentDate;
        });
        if (exists) {
            addLog('该短信已处理，跳过重复', 'info');
            return;
        }

        // 准备新记录
        // 注意（B8 修复）：year/month/day/weekday 直接从 timestamp 推导，
        // 避免 currentYear（脚本加载时计算）跨年错位。
        var now = new Date();
        let record = {
            id: Date.now(),
            timestamp: now.toISOString(),
            date: currentDate,
            time: now.toLocaleTimeString(),
            phoneNumber: sms.tel,
            content: sms.content,
            year: now.getFullYear(),
            month: now.getMonth() + 1,
            day: now.getDate(),
            weekday: now.getDay()
        };


        // 第二次检查：保存前再次验证（防止并发添加）
        loadAlertRecords();
        exists = alertRecords.some(function(r) {
            return r.phoneNumber === sms.tel && r.content === sms.content && r.date === currentDate;
        });
        if (exists) {
            addLog('并发检测到重复记录，已自动跳过', 'info');
            return;
        }
        // 使用已准备的记录对象
        alertRecords.push(record);

        // 保存到对应年份的 prefs key，避免跨年保存时
        // currentYear 与 record.year 不一致导致数据丢失
        saveAlertRecords(record.year);
        addLog('已记录警报事件: ' + record.date + ' ' + record.time, 'success');
    }

    // 保存警报记录到本地存储
    // year 参数用于跨年场景：脚本加载时计算的 currentYear 可能与
    // 最新一条记录的 year 不一致，用 record.year 作为 key 更准确（B8 修复）。
    function saveAlertRecords(year) {
        var useYear = (year !== undefined && year !== null) ? year : currentYear;
        try {
            api.setPrefs({
                key: 'alertRecords_' + useYear,
                value: JSON.stringify(alertRecords)
            });
        } catch (e) {
            addLog('保存警报记录失败: ' + e.message, 'error');
        }
    }
    
    // 从本地存储加载警报记录
    function loadAlertRecords() {
        try {
            var savedRecords = api.getPrefs({sync: true, key: 'alertRecords_' + currentYear});
            if (savedRecords) {
                alertRecords = JSON.parse(savedRecords);
                addLog('已加载' + alertRecords.length + '条警报记录', 'success');
            } else {
                alertRecords = [];
                addLog('未找到历史警报记录', 'info');
            }
        } catch (e) {
            alertRecords = [];
            addLog('加载警报记录失败: ' + e.message, 'error');
        }
    }
    
    // 显示统计页面
    function showStatistics() {
        // 通过父窗口切换页面
        if (api.winName === 'homeFrame') {
            // 如果在框架中，通知父窗口切换
            api.execScript({
                name: 'main',
                script: 'switchPage("statistics");'
            });
        } else {
            // 独立运行时，打开统计页面
            api.openWin({
                name: 'test_SMS_monitor_statistics',
                url: './test_SMS_monitor_statistics.html',
                pageParam: {
                    currentYear: currentYear
                }
            });
        }
    }
