<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
    <title>更多选项</title>
    <style>
        * { margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        html, body { height: 100%; overflow: hidden; }

        /* 遮罩：半透明，让底层 frame 内容隐约可见 */
        .more-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .more-mask.show { opacity: 1; }

        /* 底部菜单：紧凑样式 */
        .more-sheet {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            background: rgba(247,247,248,0.98);
            border-radius: 12px 12px 0 0;
            z-index: 2;
            transform: translateY(100%);
            transition: transform 0.25s ease;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
            max-height: 60vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.12);
        }
        .more-sheet.show { transform: translateY(0); }

        .more-sheet-title {
            text-align: center;
            font-size: 12px;
            color: #8e8e93;
            padding: 10px 0 4px;
        }
        .more-sheet-item {
            background: #fff;
            text-align: center;
            font-size: 16px;
            color: #007aff;
            padding: 12px 0;
            border-top: 0.5px solid #e5e5ea;
        }
        .more-sheet-item:active { background: #ececf1; }
        .more-sheet-cancel {
            margin-top: 6px;
            font-weight: 600;
            border-top: none;
            color: #007aff;
        }
    </style>
</head>
<body>
    <div class="more-mask" id="moreMask" onclick="onCancel()"></div>
    <div class="more-sheet" id="moreSheet">
        <div class="more-sheet-title">更多选项</div>
        <div class="more-sheet-item" onclick="onAction(1)">关于应用</div>
        <div class="more-sheet-item" onclick="onAction(2)">使用帮助</div>
        <div class="more-sheet-item" onclick="onAction(3)">检查更新</div>
        <div class="more-sheet-item" onclick="onAction(4)">清除缓存</div>
        <div class="more-sheet-item" onclick="onAction(5)">导出数据</div>
        <div class="more-sheet-item" onclick="onAction(6)">导入数据</div>
        <div class="more-sheet-item" onclick="onAction(7)">打赏捐赠</div>
        <div class="more-sheet-item more-sheet-cancel" onclick="onCancel()">取消</div>
    </div>
    <script src="../script/api.js"></script>
    <script>
        // 动画打开
        apiready = function () {
            setTimeout(function () {
                document.getElementById('moreMask').classList.add('show');
                document.getElementById('moreSheet').classList.add('show');
            }, 30);
        };

        // 选中某项：通知主框架执行对应功能（主框架收到后关闭菜单 frame 再执行）
        function onAction(index) {
            api.sendEvent({ name: 'moreSheetAction', extra: { index: index } });
        }

        // 取消：通知主框架恢复状态
        function onCancel() {
            api.sendEvent({ name: 'moreSheetCancel' });
        }
    </script>
</body>
</html>
